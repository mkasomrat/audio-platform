name: Unpack upload
on:
  push:
    paths: ["audio-platform-*.zip"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into the repository
        run: |
          ZIP=$(ls audio-platform-*.zip | tail -n1)
          mkdir /tmp/x && unzip -q "$ZIP" -d /tmp/x
          cp -a /tmp/x/audio-platform/. .
          rm -f audio-platform-*.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack $ZIP"
          git push
